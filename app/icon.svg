<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="64" height="64">
  <rect width="60" height="60" rx="8" fill="#012169"/>
  <clipPath id="round">
    <rect width="60" height="60" rx="8"/>
  </clipPath>
  <g clip-path="url(#round)">
    <clipPath id="t2">
      <path d="M30,30 h30 v30 z v30 h-30 z h-30 v-30 z v-30 h30 z"/>
    </clipPath>
    <!-- White saltire -->
    <path d="M0,0 L60,60 M60,0 L0,60" stroke="#ffffff" stroke-width="9"/>
    <!-- Red saltire -->
    <path d="M0,0 L60,60 M60,0 L0,60" clip-path="url(#t2)" stroke="#C8102E" stroke-width="5"/>
    <!-- White cross -->
    <path d="M30,0 v60 M0,30 h60" stroke="#ffffff" stroke-width="14"/>
    <!-- Red cross -->
    <path d="M30,0 v60 M0,30 h60" stroke="#C8102E" stroke-width="8"/>
  </g>
</svg>